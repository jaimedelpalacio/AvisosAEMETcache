# render.yaml
# Servicio web Node (sin Dockerfile). El cron se crea a mano en el panel de Render.
# Los secretos (AEMET_API_KEY, RENDER_CRON_TOKEN) se configuran SOLO en el dashboard
# de Render (Environment), nunca en este fichero.

services:
  - type: web
    name: aemet-avisos-zona-cache
    env: node
    region: oregon
    plan: starter
    autoDeploy: true
    buildCommand: "npm install"
    startCommand: "npm start"
    envVars:
      - key: AEMET_API_KEY
        sync: false
      - key: RENDER_CRON_TOKEN
        sync: false
      # OJO: el código lee AREAS (no AEMET_AREAS)
      - key: AREAS
        value: "61,72,77"
      - key: CACHE_TTL_SECONDS
        value: "8100"
